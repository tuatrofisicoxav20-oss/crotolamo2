# Configuración de Crotolamo 2.
# CERO hardcodeo: todas las rutas usan ~ y se expanden en settings.py.
# El usuario actual se detecta solo (nada de /home/exitili quemado).
#
# Para overrides locales sin tocar este archivo, crea config/crotolamo.local.toml
# (está en .gitignore) con solo las claves que quieras cambiar.

[paths]
# ~ se expande al home del usuario que corre el proceso.
home       = "~"
documentos = "~/Documentos"
descargas  = "~/Descargas"
# Voz Piper (Fase 5). Apunta a donde tengas el modelo .onnx.
voces      = "~/Documentos/crotolamo2/voices"
# Base de datos de memoria persistente (Fase 4).
db         = "~/.crotolamo/crotolamo.sqlite"
# Notas creadas por la tool create_note (Fase 3).
notas      = "~/Documentos/crotolamo_notas"

# Allowlist de raíces donde las tools de archivo pueden operar (Fase 3).
# El guard rechaza cualquier ruta fuera de estas raíces.
allowed_roots = [
    "~/Documentos",
    "~/Descargas",
    "~/.crotolamo",
]

# Zona de CONFIRMACIÓN: rutas fuera de allowed_roots pero dentro de estas
# raíces se permiten PIDIENDO PERMISO por voz ("¿lo hago, patrón?"). Fuera de
# ambas zonas sigue bloqueado. Así Crotolamo puede usar toda la lap sin hacer
# nada delicado a la mala.
confirm_roots = ["~"]

# Personalidad del asistente: "desmadrosa" (buen pedo, echador de relajo,
# expresiones mexicanas; el desmadre nunca estorba la tarea) o "clasica"
# (directo y sarcástico, el tono original). extra = texto libre opcional que
# se anexa al prompt del estilo elegido.
[persona]
style = "desmadrosa"
extra = ""

# Proyectos del patrón sobre los que Crotolamo puede razonar (Fase 3).
[projects]
crotolamo  = "~/Documentos/crotolamo2"
huevonitis = "~/Documentos/huevonitis 4"
# Checkpoint de Crotolamo 1 guardado como referencia de migración (read-only).
crotolamo1 = "~/Documentos/crotolamo2/reference/c1_checkpoint/chapi_assistant"

[logging]
# Nivel de log de diagnóstico (DEBUG/INFO/WARNING/ERROR). La env CROTOLAMO_LOG manda.
level = "INFO"

# Doctor (`python -m crotolamo doctor`): qué pila debe auditar. Los defaults
# describen lo que trae ESTE repo: nube OpenAI-compatible vía [llm.glm] (con su
# key en la env), STT faster-whisper, TTS Piper ([paths].voces + [voice].piper_voice),
# AEC de PipeWire (desktop/aec.sh) y un servicio de música. El doctor no adivina:
# si tu stack es otro, apúntalo aquí (mejor en crotolamo.local.toml). Ejemplo
# para la pila Groq + Parakeet + Kokoro + Soloist:
#   [llm.glm]  base_url = "https://api.groq.com/openai/v1"   (y model = el de Groq)
#   [doctor]   stt_module = "onnx_asr"
#              tts_model  = "~/Documentos/crotolamo2/voices/kokoro-v1.0.onnx"
#              tts_voices = "~/Documentos/crotolamo2/voices/voices-v1.0.bin"
#              tts_voice  = "em_alex"
# Un REQUERIDO en rojo (key, nube, stt, tts, aec) hace salir con 1; los
# opcionales (Ollama de respaldo, música, Spotify, listeners...) solo se reportan.
[doctor]
# STT principal: módulo Python que debe importar ("faster_whisper"; "onnx_asr" para
# Parakeet). stt_model: ruta (con ~) de un modelo en disco que debe existir; vacío
# = no hay archivo que comprobar (faster-whisper descarga y cachea el suyo).
stt_module = "faster_whisper"
stt_model  = ""
# TTS principal. tts_model vacío = Piper: se comprueba [paths].voces/[voice].piper_voice
# (y su .onnx.json al lado). Con tts_model (p.ej. Kokoro) se comprueba ese archivo;
# tts_voices = archivo de voces (.bin/.npz de numpy o .json) y tts_voice = la voz
# que debe contener. Vacíos = no se comprueban.
tts_model  = ""
tts_voices = ""
tts_voice  = ""
# Nodos PipeWire de la cancelación de eco (los crea desktop/aec.sh). Deben existir,
# ser el source y el sink por DEFECTO (sin el sink como default, el AEC no tiene
# referencia y Crotolamo se activa con su propia voz) y el source sin mute. Si
# [voice].input_device apunta al source, que no sea el default solo avisa.
# aec_source = "" y aec_sink = "" desactivan el check (máquina sin AEC).
aec_source = "crotolamo_aec_source"
aec_sink   = "crotolamo_aec_sink"
# Servicio de música: unidad de `systemctl --user` y su WebSocket local.
# musica_service = "" desactiva el check del servicio (el del WebSocket sigue).
musica_service = "soloist.service"
musica_host    = "127.0.0.1"
musica_port    = 9090
# Fecha (TOML, sin comillas) en que caduca la credencial del servicio de música y
# con cuántos días de antelación avisar (⚠️). Ponla a "" para no vigilarla.
musica_caduca     = 2026-11-29
musica_aviso_dias = 14
# Env con el client id de Spotify. Solo se comprueba que exista; nunca se imprime.
spotify_client_id_env = "SPOTIFY_CLIENT_ID"

[llm]
# Motor de inferencia: "ollama" (local, CPU) o "glm" (nube, Z.ai).
#
# POR QUÉ "glm": esta lap no tiene GPU dedicada. Inferir qwen-7b en CPU cuesta
# ~17-22s por turno con tool y deja la RAM en swap. GLM-4.7-Flash es GRATIS y
# responde en ~1-2s, sacando la inferencia de la máquina. Con backend="glm" los
# ~5 GB del modelo local dejan de residir en RAM.
#
# Requiere una API key (gratuita en https://z.ai). NO se guarda aquí (este
# archivo va a git): exportala en tu shell.
#     export CROTOLAMO_GLM_API_KEY="tu-key"
#
# Si pones "glm" y no hay key, Crotolamo avisa y cae solo a Ollama.
# La env CROTOLAMO_LLM_BACKEND pisa esta clave (para probar sin editar nada).
backend     = "glm"

# --- Motor local (backend = "ollama") ---
host        = "http://localhost:11434"
model       = "qwen2.5-coder:7b"
temperature = 0.2
# Timeout de una llamada al LLM. Bajado de 600 a 180: con tool routing los turnos
# son cortos, y 600s significaba que un Ollama colgado dejaba la voz "pensando"
# hasta 10 min. 180s cubre un arranque en frío (~60-120s) + la respuesta; si se
# excede, devuelve error en personaje y la voz vuelve a reposo (no se queda pegada).
timeout     = 180
# Máximo de iteraciones del loop agéntico (anti-loop infinito).
max_iterations = 6
# Tool routing: en vez de mandarle al modelo las ~32 tools en cada turno (lento en
# CPU: ~130s evaluando el prompt), se le mandan solo las relevantes a la consulta
# (~2-5s). Medido aquí: 6 tools = 2.4s vs 30 tools = 142s. Déjalo en true salvo
# que quieras depurar. max_tools = tope de tools por turno.
# OJO: con backend="glm" esto SOLO aplica cuando el respaldo local está activo
# (sin internet). Con la nube arriba, GLM ve TODAS las tools y razona él.
tool_routing = true
max_tools = 8
# keep_alive: cuánto mantiene Ollama el modelo residente en RAM tras responder.
# Evita pagar la recarga del modelo (~60s en frío) en cada turno de una sesión.
# OJO: el cache de prefijo NO amortiza entre turnos (cada turno re-evalúa el prompt);
# lo que hace usable el rendimiento es el tool_routing de abajo (prompt chico), no
# este keep_alive. Medido aquí con routing: charla ~5s, acción con tool ~17-22s.
# "15m" = no recarga durante la sesión y libera RAM tras 15 min ocioso. Sube a "1h"
# o "-1" (siempre residente) si te sobra RAM; baja si la lap va justa de memoria.
keep_alive = "15m"
# Ventana de contexto que Ollama reserva. Con el tool routing los prompts son
# cortos; 2048 sobra y en CPU reduce memoria/trabajo del KV-cache. Súbelo si
# activas [memory].compaction con historiales largos.
num_ctx = 2048
# Fast-path SIN LLM (misión velocidad): comandos inequívocos ("pausa la
# música", "qué apps tengo abiertas", "abre opera") ejecutan la tool directo
# (~0.1s en vez de ~17-22s de LLM). Solo tools seguras; cualquier frase con
# matices cae al agente normal. false = todo pasa por el LLM.
# OJO: con backend="glm" se IGNORA (queda en off): nada de comandos prehechos,
# GLM razona y redacta cada turno. Este knob solo aplica al motor local.
fastpath = true

# --- Motor en la nube (backend = "glm") ---
# Solo se lee si backend = "glm". La API key va en la env, nunca aquí.
[llm.glm]
base_url = "https://api.z.ai/api/paas/v4"
# glm-4.7-flash: gratuito para usuarios registrados y con tool-calling nativo.
# Si algún día quieres más músculo y no te importa pagar: "glm-4.7" o "glm-5.2".
model    = "glm-4.7-flash"
# 60s sobra: la nube responde en ~1-2s. El timeout de 180s de Ollama existía por
# el arranque en frío del modelo local, que aquí no aplica.
timeout  = 60
# Razonamiento interno del modelo ANTES de responder. GLM-4.7 lo trae ENCENDIDO por
# defecto; aquí se apaga. MEDIDO contra la API real (2026-07-09):
#     charla:  thinking=on 6.87s  |  thinking=off 1.23s   (5.6x)
#     acción:  thinking=on 1.57s  |  thinking=off 1.23s   (tool-calls 3/3 en ambos)
# Un "hola" con thinking gasta ~460 tokens de reasoning para nada. En voz, esos 5s
# de más se sienten. Ponlo en true si prefieres que razone preguntas difíciles.
thinking = false
# Respaldo local: si GLM falla en caliente (se cayó el wifi, la key caducó, un 429),
# Crotolamo usa el modelo de Ollama de arriba durante estos segundos antes de volver
# a intentar la nube. Sin esto, cada frase esperaría el timeout para nada. Es lo que
# permite seguir usando el asistente SIN INTERNET, aunque más lento.
fallback_cooldown_s = 60

[memory]
# Ventana deslizante del historial conversacional (nº de turnos user+assistant).
max_turns = 20
# M5: al exceder max_turns, resumir los turnos viejos en vez de descartarlos.
# Cuesta una llamada corta al LLM por compactación; default false para no gastar.
compaction = false

# Memoria SEMÁNTICA de largo plazo (mem0 + Chroma + fastembed): Crotolamo recuerda
# lo que le cuentas de ti y lo trae cuando viene al caso, sesión tras sesión.
# Requiere la extra: pip install -e ".[memoria]" (versiones fijadas en pyproject).
# Almacenamiento FUERA del repo (ruta). Con enabled = true, las tools de hechos
# SQLite (remember_fact/...) se retiran de la vista del modelo y sus hechos se
# copian con `python -m crotolamo memoria migrar`. Contenido: SOLO hechos sobre
# ti (gustos, personas, costumbres, preferencias); nada de proyectos/pendientes
# (eso irá a Notion) y NUNCA secretos (se rechazan antes de guardar).
[memoria]
enabled = false
# Umbral de score de mem0.search. OJO: NO es coseno. mem0 calcula 1/(1+distancia
# L2 de Chroma): un par con coseno 0.63 sale como 0.047. MEDIDO (scripts/
# memoria_calibrar.py, 10 preguntas parafraseadas): el default 0.1 de mem0 pierde
# 10/10 aciertos, 0.04 pierde 3/10, 0.02-0.03 conserva 10/10. El umbral es solo un
# suelo de ruido; la calidad la da el ranking con top_k chico. Si cambias el
# embedder, recalibra: python -m crotolamo memoria calibrar
umbral = 0.03
# Recuerdos que se inyectan por turno al contexto del LLM (pocos: son tokens y ruido).
top_k = 3
ruta = "~/.local/share/crotolamo/memoria"
# Tope de espera de la recuperación por turno: si la memoria tarda más, la
# respuesta sale sin recuerdos (WARNING). La voz nunca espera a la memoria.
timeout_busqueda_s = 1.5
# Extracción automática de hechos tras cada turno (en segundo plano, con el LLM
# de abajo). false = solo se guarda lo que pidas con "acuérdate de que...".
extraer = true
# Embeddings locales (fastembed, ONNX, sin GPU). Multilingüe: entiende español.
modelo_embeddings = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
dims_embeddings = 384
# LLM que EXTRAE los hechos (no es el cerebro de Crotolamo). "groq" usa el SDK de
# Groq con la MISMA key de la nube (CROTOLAMO_GLM_API_KEY); "openai" = cualquier
# endpoint OpenAI-compatible ([llm.glm].base_url, p.ej. Z.ai); "ollama" = modelo
# local de [llm] (sin key, más lento).
llm_provider = "groq"
llm_model = "openai/gpt-oss-120b"
# Id del usuario dentro de mem0 (por si algún día hay más de un patrón).
usuario = "patron"

# Apps que el patrón puede abrir por nombre (open_app). Edítalas para tu entorno
# (Hyprland): clave = lista de argumentos del comando. El 'terminal' se AUTODETECTA
# (kitty/foot/alacritty/...) si no lo defines aquí; el explorador de archivos también
# puedes cablearlo en 'archivos'.
[apps]
opera         = ["flatpak", "run", "com.opera.opera-gx"]
"opera gx"    = ["flatpak", "run", "com.opera.opera-gx"]
spotify       = ["flatpak", "run", "com.spotify.Client"]
blender       = ["blender"]
vscode        = ["code"]
geany         = ["geany"]
libreoffice   = ["libreoffice"]
calculadora   = ["gnome-calculator"]
archivos      = ["nautilus"]

[voice]
# I3: 'base' es casi igual que 'small' en español y mucho más rápido en CPU.
whisper_model      = "base"
# Modelo barato solo para detectar la palabra de activación (wake).
wake_whisper_model = "tiny"
piper_voice        = "es_MX-ald-medium.onnx"
sample_rate        = 16000
# Micrófono que abre Crotolamo. Comentado = el default del sistema (comportamiento
# histórico). Tras activar la cancelación de eco (`desktop/aec.sh on`), apúntalo al
# source limpio: así SOLO Crotolamo usa el AEC y no cambias el default global (que
# afectaría a Discord, el navegador, etc.). El AEC es lo que permite, más adelante,
# volver a `use_oww = true` sin que el asistente se autodispare con su propia voz.
# input_device = "crotolamo_aec_source"
# VAD (M2, de GLaDOS): 'silero' (neuronal) o 'energy' (fallback sin modelo).
vad_backend          = "silero"
vad_threshold        = 0.8
# Histéresis del VAD (contra "se corta a media frase"). vad_threshold es el umbral
# para ENTRAR en voz; vad_neg_threshold es el umbral (más bajo) para MANTENERSE en
# ella. Sin histéresis, una micro-pausa de respirar/pensar cae bajo 0.8 y empieza a
# contar silencio -> trunca el comando. Con 0.35, sigues "en voz" durante la pausa.
# Activada (misión "entender cada palabra"): sin ella, las pausas de respirar
# cortaban comandos a media frase y se perdían palabras. Coméntala para volver
# al comportamiento histórico; mide con:
#   .venv/bin/python scripts/stt_harness.py record --n 10 --dir stt_bench
vad_neg_threshold  = 0.35
# Buffer de pre-activación: ms de audio previos que se anteponen para no perder
# las primeras sílabas.
vad_preactivation_ms = 800
# Silencio sostenido que cierra la grabación del comando. Historia: 640 -> 900
# (toleraba la pausa tras "crotolamo") -> 600 (misión velocidad): ahora el
# endpointing inteligente (smart_endpoint) REABRE la escucha si la frase quedó
# a medias, así que el corte puede ser agresivo sin perder oraciones. Menos
# silencio = Crotolamo reacciona ~300ms antes en CADA comando.
vad_silence_ms       = 600
# M3.8: mitigación de eco del barge-in (con altavoces y sin AEC). Con auriculares
# es confiable; si con altavoces se auto-dispara, usa --no-barge-in.
barge_in_grace_ms         = 400   # ignora barge-in los primeros ms tras empezar a hablar
barge_in_threshold_margin = 0.1   # umbral VAD más alto mientras suena el TTS
barge_in_min_chunks       = 5     # racha de chunks de voz para disparar (no un pico)
# Hotwords (faster-whisper >= 1.0.2): sesgo del decoder hacia nombres propios,
# SOLO en la transcripción de comandos (post-wake). La detección de wake NO lo
# usa: un sesgo con "crotolamo" sobre silencio aumentaría falsos despertares.
# Overridable desde crotolamo.local.toml como el resto de la config.
hotwords = "Crotolamo, Tletl, Huevonitis"
# Endpointing inteligente: si la transcripción parece una oración A MEDIAS
# (termina en "de", "para", "y", coma, o es un verbo colgado como "abre"),
# se reabre la escucha endpoint_continue_s segundos y se concatena la
# continuación, hasta endpoint_max_rounds veces. Así una pausa de PENSAR no
# corta el comando. false = comportamiento clásico (corte por silencio fijo).
smart_endpoint      = true
endpoint_max_rounds = 2
endpoint_continue_s = 2.5
# Conversación continua: tras responder, Crotolamo sigue escuchando esta
# ventana (segundos) SIN exigir "crotolamo" otra vez. Si no dices nada, la
# ventana expira y vuelve a esperar la palabra de activación. 0 = apagado.
followup_s = 6.0
# --- Misión velocidad (que actúe EN CUANTO terminas de hablar) ---
# beam_size del decoder Whisper. MEDIDO en esta lap (CTranslate2 int8): bajar
# el beam NO acelera — beam5 1.73s < beam2 2.04s < beam1 2.52s (el beam search
# de ct2 está mejor optimizado que el greedy). Se queda en 5: máxima precisión
# gratis. El knob existe por si otra build/equipo se comporta distinto.
beam_size = 5
# Acuse tras el wake: "beep" = bip instantáneo NO bloqueante (puedes hablar ya),
# "voz" = "Te escucho, patrón" hablado (~1s de espera), "off" = solo el HUD.
ack = "beep"
# Hablar cada frase EN CUANTO el LLM la genera (streaming), en vez de esperar
# la respuesta completa: la primera palabra suena varios segundos antes.
stream_speak = true
# Ventanas del WAKE: silencio de corte chico (400ms detecta "crotolamo" solo
# casi al instante), pero tope AMPLIO para que "crotolamo pausa la música"
# dicho DE CORRIDO quepa completo y se atienda directo (sin segundo turno de
# escucha). El tope no estorba al caso corto: el silencio corta antes.
wake_silence_ms  = 400
wake_max_seconds = 8.0
# --- Wake con música sonando ---
# Con Spotify/YouTube sonando, Whisper transcribe letras y de vez en cuando algo
# suena a "crotolamo" (falsos despertares); y ya despierto, la música tapa la
# orden. Un hilo sondea playerctl (MPRIS) en segundo plano y cachea si hay algún
# reproductor en Playing: con música el wake exige un umbral más alto y, al
# activarse, la música se atenúa hasta que Crotolamo termina de responder (se
# restaura al volumen EXACTO que tenía). La voz propia (Piper) nunca cuenta como
# música. Sin playerctl instalado, todo esto es un no-op.
wake_threshold_media = 0.85   # umbral del wake difuso mientras algo suena (playerctl en Playing); sin música se usa [wake].threshold
media_poll_s = 1.5            # cada cuánto se sondea en segundo plano si hay música (caché; el oído nunca espera)
wake_duck = true              # atenuar la música al activarse y restaurarla al terminar
wake_duck_volume = 0.2        # fracción del volumen actual mientras Crotolamo escucha y responde

# Domótica vía Home Assistant (tools light_control / home_state).
[home]
# URL de tu Home Assistant en la red local. El token de acceso de larga duración
# va en el entorno (CROTOLAMO_HASS_TOKEN), NUNCA aquí (este archivo va a git).
base_url = "http://homeassistant.local:8123"

[home.lights]
# nombre amigable = entity_id real de Home Assistant. RELLENA con los tuyos.
xbox = "light.xbox_led"   # RELLENA

# Cámaras vía Frigate (tools camera_events / camera_snapshot).
[cameras]
# URL de tu Frigate en la red local. Frigate no pide token.
base_url = "http://frigate.local:5000"

[cameras.names]
# alias amigable = nombre de la cámara en Frigate. RELLENA (o deja vacío para
# usar los nombres tal cual los tiene Frigate).
entrada = "front_door"   # RELLENA

[wake]
target    = "crotolamo"
# Subido de 0.67 a 0.72: el wake difuso (Whisper) daba falsos positivos ("romano"
# disparaba). Más estricto = menos fantasmas, a costa de exigir mejor pronunciación.
threshold = 0.72
# QUÉ WAKE (y qué loop) corre. true = openWakeWord + loop CONCURRENTE (Ear/Stt/
# Brain/Mouth, barge-in); false = wake DIFUSO con Whisper + loop SIMPLE
# (secuencial). Si openwakeword no está instalado se cae solo al difuso. OJO:
# varias claves de [voice] solo aplican al modo simple: ack, stream_speak,
# smart_endpoint/endpoint_*, followup_s, wake_silence_ms/wake_max_seconds.
use_oww = true
# M1: wake word dedicado con openWakeWord. 'crotolamo' no tiene modelo pre-entrenado,
# así que se usa un modelo PUENTE soportado hasta entrenar uno propio.
oww_model     = "hey_jarvis"
oww_threshold = 0.5
# Umbral de openWakeWord mientras suena música (mismo sondeo que
# [voice].wake_threshold_media). Escala DISTINTA a la del wake difuso: aquí 0.5
# es lo normal y 0.7 ya es estricto; por eso son dos knobs y no uno.
oww_threshold_media = 0.7
# Variantes CERCANAS a "crotolamo" (cómo lo transcribe mal Whisper). Se podaron
# las muy lejanas ("corto la mano", "control amo", "cuatro lamo", "proto/troto
# lamo") que provocaban falsos positivos. Se añadieron mishears reales del log
# ("gotolamo", "cottoy amo"). Si ves en el log que tu "crotolamo" se transcribe
# distinto, añade esa forma aquí.
variants  = [
    "crotolamo", "croto lamo", "gotolamo", "grotolamo", "crotoamo",
    "coto lamo", "coto y amo", "cottoy amo", "croto el amo", "crotolo amo",
]

# ---------------------------------------------------------------------------
# MCP (Model Context Protocol), M4: servers EXTERNOS que le prestan tools a
# Crotolamo. Cada server es un proceso que Crotolamo lanza y con el que habla por
# stdio (JSON-RPC); sus tools aparecen al LLM como `mcp_<prefix>_<tool>` y pasan
# por el MISMO guard (rutas) y la MISMA confirmación del patrón que las nativas.
# Solo transporte stdio (nada de HTTP/SSE) y solo tools (sin resources/prompts).
# Detalles en README_M4.md.
# ---------------------------------------------------------------------------
[mcp]
# Apagado por defecto: activarlo lanza procesos externos al arrancar.
enabled = false
# Timeout por LLAMADA a una tool (segundos). Si expira, el LLM recibe un aviso en
# personaje y cuenta un strike; al 2º timeout SEGUIDO el server se desconecta y
# sus tools desaparecen (un server colgado no debe costar 20s por cada intento).
timeout_s = 20
# Presupuesto para arrancar cada server (lanzar + handshake + lista de tools).
# Si no llega, se avisa en el log y se salta: un server caído NUNCA impide que
# Crotolamo arranque. Súbelo si un server tarda (p.ej. npx descargando).
startup_timeout_s = 15
# Cuándo pedir confirmación antes de ejecutar una tool MCP:
#   "destructive" = pregunta salvo que el server declare la tool como de solo
#                   lectura (readOnlyHint) o no destructiva (destructiveHint=false).
#                   OJO: esos hints los declara EL SERVER y son de buena fe; un
#                   server mentiroso se salta la confirmación. Para servers en
#                   los que no confíes, usa "always".
#   "always"      = pregunta siempre.
#   "never"       = nunca pregunta (solo para servers de solo lectura y de fiar).
confirm = "destructive"

# Cada server es una TABLA NOMBRADA [mcp.servers.<nombre>] (no un array): así
# crotolamo.local.toml puede añadir o retocar un server sin pisar los demás.
# Claves: command (argv completo; ~ y $VARS se expanden en cada elemento), env
# (tabla opcional que se SUMA al entorno), cwd, timeout_s, startup_timeout_s,
# confirm (mismos valores que arriba; pisa el global), keywords (lista para el
# routing local; default: nombre del server + palabras de sus tools) y prefix
# (default: el nombre del server).
#
# Ejemplo: el server de filesystem oficial, limitado a ~/Documentos.
# [mcp.servers.archivos]
# command  = ["npx", "-y", "@modelcontextprotocol/server-filesystem", "~/Documentos"]
# keywords = ["archivo", "archivos", "documento", "carpeta", "busca en documentos"]
# confirm  = "destructive"
# timeout_s = 20
# [mcp.servers.archivos.env]
# # Las claves y tokens van en el entorno del patrón, NUNCA aquí:
# # MI_TOKEN = "$MI_TOKEN"
