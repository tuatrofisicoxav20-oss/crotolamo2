# Cancelación de eco acústico (AEC) para Crotolamo — PipeWire + WebRTC
# ============================================================================
# STAGED: este archivo NO está activo. Instálalo con:
#
#     desktop/aec.sh on      # copia a ~/.config/pipewire/pipewire.conf.d/ y reinicia pipewire
#     desktop/aec.sh status  # ver si el source virtual existe
#     desktop/aec.sh off     # revertir
#
# ---------------------------------------------------------------------------
# POR QUÉ
# ---------------------------------------------------------------------------
# El micrófono capta la voz que sale del altavoz. Como el wake word "crotolamo"
# se entrenó con voz Piper y el TTS del asistente TAMBIÉN es Piper, el modelo se
# AUTODISPARA al oírse a sí mismo -> bucle infinito. Por eso hoy `use_oww = false`.
#
# El AEC crea un *source virtual* que RESTA del micrófono la señal enviada al
# altavoz. El eco desaparece ANTES de llegar al detector. A diferencia del gating
# (ignorar el micro mientras habla), el AEC PRESERVA el barge-in: puedes
# interrumpir a Crotolamo hablando encima de él.
#
# Verificado en esta máquina (2026-07-09): `libspa-aec-webrtc.so` está instalado
# y el módulo carga creando el source virtual correctamente.
#
# ---------------------------------------------------------------------------
# DESPUÉS DE ACTIVAR
# ---------------------------------------------------------------------------
# Crotolamo debe ABRIR este source, no el micrófono crudo. No hace falta cambiar
# el default del sistema (eso afectaría a Discord, el navegador, etc.). En su
# lugar, pon en config/crotolamo.local.toml:
#
#     [voice]
#     input_device = "crotolamo_aec_source"
#
# Comprueba que el eco muere de verdad ANTES de poner `use_oww = true`:
#     .venv/bin/python scripts/wake_debug.py --threshold 0.3
# y deja que Crotolamo hable (o reproduce TTS de Piper). Si no hay activaciones
# fantasma, el AEC funciona.
# ============================================================================

context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            # Motor WebRTC (el que trae Fedora: libspa-aec-webrtc.so)
            library.name = aec/libspa-aec-webrtc

            # Latencia del bloque de procesado. 512/48000 ~= 10.6 ms: suficiente
            # para el AEC y bajo para no añadir retardo perceptible al barge-in.
            node.latency = 512/48000

            aec.args = {
                # El AEC debe hacer SOLO cancelación de eco. El resto de la cadena
                # (VAD de silero, normalización) ya lo hace Crotolamo; duplicarlo
                # aquí degradaría la señal que ve Whisper.
                webrtc.gain_control          = false
                webrtc.noise_suppression     = true
                webrtc.echo_canceller        = true
                # 'extended_filter' ayuda cuando micro y altavoz están en el mismo
                # chasis (laptop): el eco llega fuerte y con retardo variable.
                webrtc.extended_filter       = true
                webrtc.high_pass_filter      = true
            }

            # Nombres estables: son los que pondrás en [voice].input_device
            source.props = {
                node.name        = "crotolamo_aec_source"
                node.description = "Micrófono sin eco (Crotolamo)"
            }
            sink.props = {
                node.name        = "crotolamo_aec_sink"
                node.description = "Salida con referencia AEC (Crotolamo)"
            }
            capture.props  = { node.passive = true }
            playback.props = { node.passive = true }
        }
    }
]
