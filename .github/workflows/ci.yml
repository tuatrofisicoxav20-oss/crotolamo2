name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 es la versión de la lap del patrón (requires-python >= 3.11);
        # 3.12 vigila que el código no se quede atrás. Cada job chequea tipos
        # con SU intérprete: los stubs de numpy >= 2.5 (solo 3.12+) usan la
        # sintaxis `type X = ...` de PEP 695 y mypy fijado a 3.11 los
        # rechazaba, dejando CI en rojo antes de llegar a pytest.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Dependencias del sistema (portaudio para sounddevice)
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libsndfile1

      - name: Instalar el proyecto (dev + voice)
        # silero-vad arrastra torch; sin el índice CPU, pip baja la build CUDA
        # (varios GB de nvidia-*/triton) que en CI no sirve de nada.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,voice]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (tipos)
        run: mypy crotolamo interfaces

      - name: Pytest
        run: pytest -q
